[project]
name = "podcastsim"
version = "0.1.0"
description = "Podcast archive -> per-host voice clones -> rendered fake episodes"
requires-python = ">=3.12"

# Orchestrator only. CPU-only, no ML deps -- those live in envs/<family>/
# requirements.txt, one venv per tool family (plan S2.6), because the audio ML
# ecosystem has mutually incompatible torch pins.
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.12",
    "numpy>=2.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
podcastsim = "podcastsim.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podcastsim"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "unit: fast CPU-only tests, no network, no GPU (M0 gate)",
    "smoke: end-to-end on fixtures; must pass in <30 min on a T4",
]
